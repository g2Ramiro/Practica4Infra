name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'practica4-infra/package-lock.json'

      - name: Install dependencies
        working-directory: ./practica4-infra # Entra a la carpeta
        run: npm ci

      - name: Run unit tests
        working-directory: ./practica4-infra # Entra a la carpeta
        run: npm test -- --run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'practica4-infra'
